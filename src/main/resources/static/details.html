<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Details</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="index.html">🐾 Animal Gallery</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link active" href="details.html">Details</a></li>
<li class="nav-item"><a class="nav-link" href="new-animal-form.html">Add Animal</a></li>
<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
</ul>
</div>
</div>
</nav>

<main class="py-5">
<div class="container">
<div id="loading" class="text-center py-5">
<div class="spinner-border text-primary" role="status">
<span class="visually-hidden">Loading...</span>
</div>
<p class="mt-3 text-muted">Loading animal details...</p>
</div>
<div id="error" class="alert alert-danger d-none" role="alert">
<i class="bi bi-exclamation-triangle me-2"></i>
<strong>Error:</strong> <span id="errorMessage">Failed to load animal details.</span>
</div>
<div id="animalDetails" class="row g-4 align-items-center d-none">
<div class="col-md-6">
<img id="animalImage" src="" alt="Animal image" class="img-fluid rounded shadow">
</div>
<div class="col-md-6">
<h1 id="animalName" class="display-6 fw-bold"></h1>
<p class="text-muted mb-1"><strong>Species:</strong> <em id="animalSpecies"></em></p>
<p class="text-muted mb-1"><strong>Type:</strong> <span id="animalType" class="badge bg-primary"></span></p>
<p class="text-muted mb-1"><strong>Age:</strong> <span id="animalAge"></span> years</p>
<p class="text-muted mb-3"><strong>Habitat:</strong> <span id="animalHabitat"></span></p>
<p id="animalDescription" class="mb-4"></p>
<div class="d-grid gap-2 d-md-flex">
<a href="index.html" class="btn btn-outline-secondary">
<i class="bi bi-arrow-left me-2"></i>Back to Gallery
</a>
<button id="editButton" class="btn btn-primary" onclick="editAnimal()">
<i class="bi bi-pencil me-2"></i>Edit Animal
</button>
<button id="deleteButton" class="btn btn-danger" onclick="deleteAnimal()">
<i class="bi bi-trash me-2"></i>Delete Animal
</button>
</div>
</div>
</div>
</div>
</main>

<footer class="py-4 bg-dark text-light">
<div class="container text-center">
<p class="mb-0">© <span id="year"></span> Animal Gallery - Celebrating Wildlife Diversity</p>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/script.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

// Get bear ID from URL parameters
const urlParams = new URLSearchParams(window.location.search);
const bearId = urlParams.get('id');

let currentBearId = null;

// Load animal details
async function loadAnimalDetails() {
    if (!bearId) {
        showError('No animal ID provided');
        return;
    }
    
    currentBearId = bearId;
    
    try {
        const animal = await fetchBearById(bearId);
        
        if (!animal) {
            showError('Animal not found');
            return;
        }
        
        // Populate the page with animal data
        document.getElementById('animalName').textContent = animal.name;
        document.getElementById('animalSpecies').textContent = animal.species;
        document.getElementById('animalType').textContent = animal.type;
        document.getElementById('animalAge').textContent = animal.age;
        document.getElementById('animalHabitat').textContent = animal.habitat;
        document.getElementById('animalDescription').textContent = animal.description;
        document.getElementById('animalImage').src = animal.imageUrl;
        document.getElementById('animalImage').alt = animal.name;
        document.getElementById('editButton').setAttribute('onclick', `editAnimal(${animal.id})`);
        document.getElementById('deleteButton').setAttribute('onclick', `deleteAnimalFromDetails(${animal.id})`);
        
        // Show details, hide loading
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('animalDetails').classList.remove('d-none');
        
        // Update page title
        document.title = `Animal Details — ${animal.name}`;
    } catch (error) {
        console.error('Error loading animal details:', error);
        showError('Failed to load animal details. Please try again.');
    }
}

function showError(message) {
    document.getElementById('loading').classList.add('d-none');
    document.getElementById('errorMessage').textContent = message;
    document.getElementById('error').classList.remove('d-none');
}

async function deleteAnimalFromDetails(bearId) {
    if (!confirm('Are you sure you want to delete this animal?')) {
        return;
    }
    
    try {
        await deleteBear(bearId);
        alert('Animal deleted successfully!');
        window.location.href = 'index.html';
    } catch (error) {
        alert('Error deleting animal. Please try again.');
        console.error(error);
    }
}

// Load details when page loads
document.addEventListener('DOMContentLoaded', loadAnimalDetails);
</script>
</body>
</html>
